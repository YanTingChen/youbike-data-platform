[defaults]
inventory = inventory.yml
roles_path = roles
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml

[ssh_connection]
# 第一次連線時記住主機金鑰，之後金鑰若改變就拒絕連線（防止連到冒充的主機）
ssh_args = -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/workspace/deploy/ansible/.known_hosts
pipelining = true
