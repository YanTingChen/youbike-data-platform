# 複製成 secrets.yml 後填入。secrets.yml 已列在 .gitignore，不會被推上 GitHub
# 密碼請用夠長的隨機字串，且只用英數字（部分值會放進連線字串）

# 寫進機器上 .env 的應用程式設定，內容同本機的 .env
app_env:
  TDX_CLIENT_ID: ""
  TDX_CLIENT_SECRET: ""
  TDX_CITY: Taichung
  GCP_PROJECT_ID: ""
  GCS_BUCKET: ""
  BQ_RAW_DATASET: youbike_raw
  BQ_DBT_DATASET: youbike
  BQ_LOCATION: asia-east1
  # 網頁用的資料快照要上傳到哪裡；該 bucket 必須公開可讀。不需要網頁時可以拿掉這一行
  SNAPSHOT_GCS_URI: ""

postgres_password: ""
airflow_jwt_secret: ""
airflow_admin_password: ""
grafana_admin_password: ""
grafana_db_password: ""

# 展示帳號的密碼，以及它的 bcrypt 雜湊（Caddy 保護 Spark UI 用，設定檔裡不放明碼）。產生雜湊：
#   docker run --rm caddy:2 caddy hash-password --plaintext '<密碼>'
demo_password: ""
demo_password_hash: ""
