[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youbike-data-platform"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ingestion*", "streaming*", "ml*", "serving*"]

[tool.setuptools.package-data]
ml = ["sql/*.sql"]
serving = ["sql/*.sql"]
streaming = ["sql/*.sql"]
