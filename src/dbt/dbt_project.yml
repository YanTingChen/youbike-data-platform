name: youbike
version: "1.0.0"
profile: youbike

model-paths: ["models"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages"]

vars:
  # 當地時區，用來切小時與日期
  local_timezone: "Asia/Taipei"
  # 增量模型每次回看的時數：涵蓋晚到的資料，以及 dbt 失敗後下一輪的補算
  lookback_hours: 3
  # 預測模型：預測多久之後的可借車數（改這個值之後要重建特徵表並重新訓練）
  forecast_horizon_minutes: 60
  # 預測模型只針對流動量最高的前 N 個站點
  ml_popular_station_count: 200

models:
  youbike:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
    ml:
      +materialized: table
      +schema: ml

snapshots:
  youbike:
    +schema: snapshots
