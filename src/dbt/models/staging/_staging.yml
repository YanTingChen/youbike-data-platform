version: 2

models:
  - name: stg_tdx__bike_availability
    description: 即時車況（已整理型態，尚未去重）
    columns:
      - name: station_uid
        data_tests: [not_null]
      - name: service_status
        description: 0 停止營運、1 正常、2 暫停
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2]
                quote: false
      - name: bikes_available
        data_tests: [not_null]
      - name: docks_available
        data_tests: [not_null]

  - name: stg_tdx__bike_stations
    description: 每個站點最新一筆基本資料
    columns:
      - name: station_uid
        data_tests: [not_null, unique]
      - name: lat
        data_tests: [not_null]
      - name: lng
        data_tests: [not_null]
